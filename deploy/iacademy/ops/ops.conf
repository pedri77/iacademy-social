# /etc/iacademy-social/ops.conf — config pública de targets para iacademy-social-ops.
# NO contiene credenciales: los secretos se leen dentro de los contenedores por Swarm.
# Instalar en el servidor con permisos 0644 (root).

# Ubicación del software (copiar deploy/iacademy/ops aquí).
OPS_HOME=/opt/saas/ops/iacademy-social

# Destino de backups: SOLO este subdirectorio gestiona la retención.
BACKUP_ROOT=/opt/saas/backups/iacademy-social/ops
BACKUP_SET_PREFIX=iacademy-social

# Cifrado: keyring público del servidor (homedir completo, no keyring alternativo) y
# recipient público; el script valida al inicio que el recipient esté importado.
GPG_HOMEDIR=/root/.config/iacademy-social/backup-gnupg
GPG_RECIPIENT=B8786DE1F2B1DA052EB5200A3B03D910CE4F96DF

# Retención: 30 días de diarios + primer completo de cada mes durante 12 meses.
RETENTION_DAILY_DAYS=30
RETENTION_MONTHLY_MONTHS=12

# Frescura: error si el último conjunto completo supera estas horas.
BACKUP_MAX_AGE_HOURS=26

# Umbrales de caducidad TLS (días): warn y error. WARN también dispara OnFailure/hook.
TLS_WARN_DAYS=30
TLS_ERROR_DAYS=7

# Targets por SERVICIO Swarm (no ID de contenedor volátil): el script resuelve la
# réplica Running única por label com.docker.swarm.service.name; 0 o >1 réplicas => fail-closed.
# --- BrightBean ---
BB_ENABLED=true
BB_PG_SERVICE=brightbean_postgres
BB_APP_SERVICE=brightbean_app
BB_DB=brightbean
BB_PG_USER=brightbean
BB_MEDIA_DIR=/app/media
# Secretos: se archiva TODO /run/secrets del contenedor (runtime, CA, web crt+key en la app;
# cert+key+password en PG), sin nombres hardcodeados. Web SIEMPRE como UID de la app
# (cap_drop ALL impide root); PG con exec normal (entrypoint conserva capacidades).
BB_APP_UID=1001

# TLS checks: endpoint público web; certs internos web/PG se leen de /run/secrets del contenedor.
BB_WEB_TLS_ENDPOINT=social.iacedemy.com:443

# --- LIOS (BD EXCLUSIVA; fail-closed si está habilitado y falta el servicio) ---
# Antes de la migración el integrador puede fijar LIOS_ENABLED=false: no es fallback
# silencioso, el check TLS de LIOS también queda deshabilitado y debe reflejarse en el runbook.
# LIOS usa el usuario root de su imagen; PostgreSQL conserva capacidades para
# archivar también postgres_password (root:root 0400), además de la clave UID 70.
LIOS_ENABLED=true
LIOS_PG_SERVICE=lios_postgres
LIOS_PG_USER=lios
LIOS_DB=lios
LIOS_APP_SERVICE=lios_api
LIOS_DATA_DIR=/srv/data
LIOS_APP_UID=0
LIOS_PG_UID=0
